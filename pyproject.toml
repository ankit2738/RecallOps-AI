[project]
name = "tom-jerry-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "band-sdk[langgraph]==8.1.0",
    "langchain-openai>=1.7.4",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "hindsight-client>=1.2.0",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
